name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default-features, no-default-features]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = no-default-features ]; then
            cargo test --no-default-features
          else
            cargo test
          fi

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --lib
      - run: cargo check --lib --no-default-features

  wasm:
    name: wasm32-unknown-unknown build and output hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown --no-default-features
      # No process or stdout here, so the hash comes from a cdylib run by Node.
      - name: Unwrap the built-in torus
        run: |
          cargo build --release --no-default-features --example torus_hash --target wasm32-unknown-unknown
          node examples/torus_hash.mjs target/wasm32-unknown-unknown/release/examples/torus_hash.wasm | tee run.log
          grep 'output hash' run.log | awk '{print $3}' > hash-wasm32-unknown-unknown.txt
          cat hash-wasm32-unknown-unknown.txt
          test -s hash-wasm32-unknown-unknown.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hash-wasm32-unknown-unknown
          path: hash-wasm32-unknown-unknown.txt

  determinism-hash:
    name: Output hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Without `direct-solver` the output depends only on IEEE-754
      # arithmetic, so every platform must produce the same atlas.
      - name: Unwrap the built-in torus
        shell: bash
        run: |
          cargo run --release --no-default-features --example unwrap | tee run.log
          grep 'output hash' run.log | awk '{print $3}' > hash-${{ matrix.os }}.txt
          cat hash-${{ matrix.os }}.txt
          test -s hash-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hash-${{ matrix.os }}
          path: hash-${{ matrix.os }}.txt

  determinism-hash-wasm:
    name: Output hash (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Unwrap the built-in torus
        run: |
          cargo build --release --no-default-features --example unwrap --target wasm32-wasip1
          wasmtime run --dir . target/wasm32-wasip1/release/examples/unwrap.wasm | tee run.log
          grep 'output hash' run.log | awk '{print $3}' > hash-wasm32-wasip1.txt
          cat hash-wasm32-wasip1.txt
          test -s hash-wasm32-wasip1.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hash-wasm32-wasip1
          path: hash-wasm32-wasip1.txt

  determinism:
    name: Same output on every platform
    needs: [determinism-hash, determinism-hash-wasm, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hash-*
          merge-multiple: true
      - name: Compare hashes
        run: |
          for f in hash-*.txt; do echo "$f: $(cat "$f")"; done
          test "$(ls hash-*.txt | wc -l)" -eq 6
          test "$(cat hash-*.txt | sort -u | wc -l)" -eq 1
