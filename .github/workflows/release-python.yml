# Builds the Python bindings' wheels and source distribution and publishes
# them to PyPI with trusted publishing (no API token: PyPI trusts this
# workflow's `pypi` environment). Runs when a GitHub release is published;
# by hand (workflow_dispatch) it only builds and tests the wheels unless
# `publish` is set.
name: Release Python

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to PyPI after building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Every platform Blender ships on; abi3 wheels serve Python 3.11+.
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, native: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, native: false }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
          - { os: windows-latest, target: x64, native: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Test the wheel
        if: matrix.native
        shell: bash
        working-directory: python
        run: |
          python -m pip install pytest numpy
          python -m pip install dist/*.whl
          python -m pytest -q tests
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: python/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || inputs.publish
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
