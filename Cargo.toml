[package]
name = "uvunwrap"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust automatic UV unwrapping: chart segmentation, LSCM + ARAP parameterization and atlas packing (lightmap UVs, baking)"
license = "MIT"
repository = "https://github.com/archonic/uvunwrap"
documentation = "https://docs.rs/uvunwrap"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "benches/**", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["uv", "unwrap", "lightmap", "atlas", "parameterization"]
categories = ["graphics", "rendering", "game-development"]

[features]
default = ["parallel", "direct-solver"]
## Parameterize charts in parallel with rayon. Disable for wasm32 without threads.
parallel = ["dep:rayon"]
## Solve LSCM and ARAP with a sparse Cholesky factorization (pure-Rust `faer`).
## Much faster on large charts; without it an iterative CGLS solver is used.
direct-solver = ["dep:faer"]

[dependencies]
rayon = { version = "1.10", optional = true }
faer = { version = "0.22", optional = true, default-features = false, features = ["std"] }

[profile.test]
opt-level = 2

[dev-dependencies]
rayon = "1.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "generate"
harness = false

# A library, so wasm32-unknown-unknown (no process, no stdout) can run it.
[[example]]
name = "torus_hash"
crate-type = ["cdylib"]

# The Python bindings (`python/`, published to PyPI with maturin) build in
# this workspace; commands run at the root still only build the crate.
[workspace]
members = ["python"]
